[package]
name = "salon-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "API del sistema de salón de belleza"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "timeout", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
